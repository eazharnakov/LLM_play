# LLM Training Configuration

model:
  name: "meta-llama/Llama-2-7b-hf"  # базовая модель из Hugging Face
  torch_dtype: "bfloat16"
  load_in_4bit: true                  # квантизация для экономии VRAM

# LoRA параметры для эффективного fine-tuning
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

# Данные
data:
  dataset_name: "tatsu-lab/alpaca"    # пример датасета
  max_seq_length: 512
  train_split: "train"
  test_size: 0.1

# Параметры обучения
training:
  output_dir: "./outputs"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  fp16: false
  bf16: true
  gradient_checkpointing: true
  report_to: "wandb"
  seed: 42
